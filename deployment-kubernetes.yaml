apiVersion: v1
kind: Namespace
metadata:
  name: django-multi-tenant-kubernetes

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: django-config
  namespace: django-multi-tenant-kubernetes
data:
  DEBUG: "True"
  DJANGO_SETTINGS_MODULE: "config.settings.local"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-multi-tenant
  namespace: django-multi-tenant-kubernetes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-multi-tenant
  template:
    metadata:
      labels:
        app: django-multi-tenant
    spec:
      containers:
        - name: django
          image: django-multi-tenant:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: django-config
                  key: DEBUG
            - name: DJANGO_SETTINGS_MODULE
              valueFrom:
                configMapKeyRef:
                  name: django-config
                  key: DJANGO_SETTINGS_MODULE
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: django-service
  namespace: django-multi-tenant-kubernetes
spec:
  type: LoadBalancer
  selector:
    app: django-multi-tenant
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: django-hpa
  namespace: django-multi-tenant-kubernetes
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: django-multi-tenant
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
