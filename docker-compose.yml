services:
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-django_multi_tenant_db}
      - POSTGRES_USER=${POSTGRES_USER:-django_multi_tenant_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-django_multi_tenant_password}
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-django_multi_tenant_user} -d ${POSTGRES_DB:-django_multi_tenant_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: django-multi-tenant:v0.1.0
    # Entrypoint handles migrations and static files. We just need to start the server.
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend

volumes:
  postgres_data:
