services:
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-django_multi_tenant_db}
      - POSTGRES_USER=${POSTGRES_USER:-django_multi_tenant_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-django_multi_tenant_password}
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-django_multi_tenant_user} -d ${POSTGRES_DB:-django_multi_tenant_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: django-multi-tenant:v0.1.0
    # The command inherited from the Dockerfile CMD (gunicorn)
    # Development-specific settings are in docker-compose.override.yml
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}

volumes:
  postgres_data:
