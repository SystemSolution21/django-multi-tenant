<!-- tenants/templates/tenants/tenant_form.html -->
{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{% if object %}Update{% else %}Create{% endif %} Tenant{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="text-center mb-4">{% if object %}Update{% else %}Create{% endif %} Tenant</h2>
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid gap-2"></div>
                            <button type="submit" class="btn btn-primary">Save</button>
                            <a href="{% url 'tenant_list' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
