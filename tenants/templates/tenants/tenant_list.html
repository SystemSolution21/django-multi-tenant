<!-- tenants/templates/tenants/tenant_list.html -->
{% extends "base.html" %}
{% block content %}
<h2>Tenants</h2>
<a href="{% url 'tenant_create' %}" class="btn btn-primary">Create Tenant</a>
<table class="table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Schema</th>
      <th>Created</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for tenant in tenants %}
      <tr>
        <td><a href="{% url 'tenant_detail' tenant.pk %}">{{ tenant.name }}</a></td>
        <td>{{ tenant.schema_name }}</td>
        <td>{{ tenant.created_at }}</td>
        <td>
          <a href="{% url 'tenant_update' tenant.pk %}" class="btn btn-outline-primary">Edit</a>
          <a href="{% url 'tenant_delete' tenant.pk %}" class="btn btn-outline-danger">Delete</a>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
