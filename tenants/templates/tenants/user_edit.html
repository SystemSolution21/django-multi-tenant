{% extends 'base.html' %}

{% block title %}Edit User{% endblock %}

{% block content %}
<div class="container">
    <h2>Edit User</h2>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="{{ form.first_name.id_for_label }}" class="form-label">First Name</label>
            {{ form.first_name }}
        </div>
        
        <div class="mb-3">
            <label for="{{ form.last_name.id_for_label }}" class="form-label">Last Name</label>
            {{ form.last_name }}
        </div>
        
        <div class="mb-3">
            <label for="{{ form.role.id_for_label }}" class="form-label">Role</label>
            {{ form.role }}
        </div>
        
        <div class="mb-3 form-check">
            {{ form.is_tenant_admin }}
            <label for="{{ form.is_tenant_admin.id_for_label }}" class="form-check-label">
                Tenant Administrator
            </label>
        </div>
        
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'user_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
